server {
  gzip on;
  listen       25884;
  listen  [::]:25884;
  server_name  localhost;
  client_max_body_size 100M;

  # 腾讯网址安全中心域名验证文件
  # 文件名: bde2645ac3e85a671673a76d669c4186.txt
  # 内容: 69137ca234e12a6ldd27la182317971lad560le4
  location = /bde2645ac3e85a671673a76d669c4186.txt {
    default_type "text/plain";
    return 200 "69137ca234e12a6ldd27la182317971lad560le4\n";
  }

  location / {
    root      /usr/share/nginx/html;
    index     index.html;
    try_files $uri $uri/ /index.html;
  }

  location @rewrites {
    rewrite ^(.*)$ /index.html last;
  }

  location /api/netease/song/url/v1 {
    proxy_buffers           16 64k;
    proxy_buffer_size       128k;
    proxy_busy_buffers_size 256k;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_set_header        X-NginX-Proxy true;
    proxy_pass              http://localhost:3000/song/url/v1;
    
    sub_filter              '"url":"http://music.163.com' '"url":"/music/unblock';
    sub_filter              '"url":"https://music.163.com' '"url":"/music/unblock';
    sub_filter_types        application/json;
    sub_filter_once         off;
  }

  location /api/netease/ {
    proxy_buffers           16 64k;
    proxy_buffer_size       128k;
    proxy_busy_buffers_size 256k;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_set_header        X-NginX-Proxy true;
    proxy_pass              http://localhost:3000/;
  }

  # 网页端解锁 API（由 server/unblock-server.mjs 提供，端口 25885）
  location /api/unblock/ {
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_pass              http://127.0.0.1:25885/unblock/;
  }

  # 媒体代理：流式转发第三方音源，禁用 nginx 缓冲支持 Range/拖动进度
  location /api/unblock/mediaproxy {
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_set_header        Range $http_range;
    proxy_pass              http://127.0.0.1:25885/unblock/mediaproxy;
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_cache             off;
    proxy_http_version      1.1;
    proxy_read_timeout      600s;
    proxy_send_timeout      600s;
    client_max_body_size    0;
  }

  location /music/unblock/ {
    proxy_pass              https://music.163.com/;
    proxy_buffering         off;
    proxy_request_buffering off;
  }
}
