server {
  gzip on;
  listen       25884;
  listen  [::]:25884;
  server_name  localhost;
  client_max_body_size 100M;

  location / {
    root      /usr/share/nginx/html;
    index     index.html;
    try_files $uri $uri/ /index.html;
  }

  location @rewrites {
    rewrite ^(.*)$ /index.html last;
  }

  location /api/netease/song/url/v1 {
    proxy_buffers           16 64k;
    proxy_buffer_size       128k;
    proxy_busy_buffers_size 256k;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_set_header        X-NginX-Proxy true;
    proxy_pass              http://localhost:3000/song/url/v1;
    
    sub_filter              '"url":"http://music.163.com' '"url":"/music/unblock';
    sub_filter              '"url":"https://music.163.com' '"url":"/music/unblock';
    sub_filter_types        application/json;
    sub_filter_once         off;
  }

  location /api/netease/ {
    proxy_buffers           16 64k;
    proxy_buffer_size       128k;
    proxy_busy_buffers_size 256k;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_set_header        X-NginX-Proxy true;
    proxy_pass              http://localhost:3000/;
  }

  # 网页端解锁 API（由 server/unblock-server.mjs 提供）
  location /api/unblock/ {
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_pass              http://127.0.0.1:25885/unblock/;
  }

  # 媒体代理：通过 node.js 服务转发（支持完整白名单 + 流式 pipe）
  # 性能优化：用 http.request + stream.pipe 而非 fetch + reader
  location /api/unblock/mediaproxy {
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_set_header        Range $http_range;
    proxy_pass              http://127.0.0.1:25885/unblock/mediaproxy;
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_cache             off;
    proxy_http_version      1.1;
    proxy_read_timeout      600s;
    proxy_send_timeout      600s;
    client_max_body_size    0;
  }

  location /music/unblock/ {
    proxy_pass              https://music.163.com/;
    proxy_buffering         off;
    proxy_request_buffering off;
  }
}
