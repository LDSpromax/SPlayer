server {
  gzip on;
  listen       25884;
  listen  [::]:25884;
  server_name  localhost;
  client_max_body_size 100M;

  location / {
    root      /usr/share/nginx/html;
    index     index.html;
    try_files $uri $uri/ /index.html;
  }

  location @rewrites {
    rewrite ^(.*)$ /index.html last;
  }

  location /api/netease/song/url/v1 {
    proxy_buffers           16 64k;
    proxy_buffer_size       128k;
    proxy_busy_buffers_size 256k;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_set_header        X-NginX-Proxy true;
    proxy_pass              http://localhost:3000/song/url/v1;
    
    sub_filter              '"url":"http://music.163.com' '"url":"/music/unblock';
    sub_filter              '"url":"https://music.163.com' '"url":"/music/unblock';
    sub_filter_types        application/json;
    sub_filter_once         off;
  }

  location /api/netease/ {
    proxy_buffers           16 64k;
    proxy_buffer_size       128k;
    proxy_busy_buffers_size 256k;
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_set_header        X-NginX-Proxy true;
    proxy_pass              http://localhost:3000/;
  }

  # 网页端解锁 API（由 server/unblock-server.mjs 提供）
  location /api/unblock/ {
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
    proxy_set_header        X-Forwarded-Host $remote_addr;
    proxy_pass              http://127.0.0.1:25885/unblock/;
  }

  # 媒体代理：nginx 直接反代第三方音源 CDN（不走 node.js，性能接近直连）
  # 前端调用：/api/unblock/mediaproxy?url=<第三方音源URL>
  # 白名单用正则校验 host，防止 SSRF
  location /api/unblock/mediaproxy {
    # DNS 解析器（动态 proxy_pass 必需，否则 nginx 启动时报错）
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    # 简单白名单校验：只放行已知音源域名
    # 不匹配 host 直接返回 403
    if ($arg_url !~* "^https?://[^/]*\.(126\.net|163\.com|kuwo\.cn|gdstudio\.xyz|myqcloud\.com|aliyuncs\.com)(/|$)") {
      return 403;
    }

    # 流式转发：禁用 nginx 缓冲（关键性能优化）
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_cache             off;
    proxy_http_version      1.1;

    # 透传 Range 支持拖动进度
    proxy_set_header        Range $http_range;
    proxy_set_header        Accept-Ranges $http_accept_ranges;
    proxy_set_header        Host $proxy_host;
    proxy_set_header        User-Agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 SPlayer/3.1";

    # 大文件超时（10 分钟，足够无损 flac 下载完）
    proxy_read_timeout      600s;
    proxy_send_timeout      600s;
    client_max_body_size    0;

    # 加 CORS 头（让浏览器 crossOrigin=anonymous 通过）
    add_header              Access-Control-Allow-Origin "*" always;
    add_header              Access-Control-Allow-Headers "Range" always;
    add_header              Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;

    # 动态 proxy_pass 到任意 URL（注意：URL 必须 set 后用变量传，否则 nginx 启动期就解析）
    proxy_pass              $arg_url;
  }

  location /music/unblock/ {
    proxy_pass              https://music.163.com/;
    proxy_buffering         off;
    proxy_request_buffering off;
  }
}
